[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brickpipe"
version = "0.3.0"
description = "Turn an LDraw model into a parts list, a BrickLink wanted list and build steps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
brickpipe = "brickpipe.cli:main"
brickpipe-ui = "brickpipe.web:main"

[tool.setuptools.packages.find]
include = ["brickpipe*"]

[tool.setuptools.package-data]
brickpipe = ["data/*.csv", "web/*.html"]
